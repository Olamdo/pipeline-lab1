name: Artifact Demo
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create build output
        run: |
          mkdir -p dist
          echo "build output" > dist/build.txt
          echo "commit: ${{ github.sha }}" > dist/version.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 5

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # No checkout here on purpose: the files can only come from the artifact
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
      - name: Check the files arrived
        run: |
          ls -la dist/
          cat dist/build.txt
          cat dist/version.txt