name: Multi-Job Pipeline
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a build file
        run: echo "build output" > build.txt
      - name: exit 1
        run: ls -la build.txt
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check style
        run: echo "Checking style..."
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: echo "Running tests..."
  report:
    needs: [build, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: echo "build=${{ needs.build.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }}"