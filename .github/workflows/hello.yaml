name: Hello Pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  hello:
    runs-on ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Say hello
        run: echo "Hello from my first pipeline"
      - name: List the files
        run: ls -la
      - name: Show what triggered this run
        run: echo "Triggered by ${{ github.event_name }} on ${{ github.ref }}"
      - name: Typo command
        run: ech "this will fail"